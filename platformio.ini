; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 默认只处理固件：pio run / pio run -t upload 不用再写 -e
; 仿真需要显式指定：pio run -e sim && .pio/build/sim/program
[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; M5Unified 会自动拉取 M5GFX；CoreS3 官方推荐用它，替代旧的 M5CoreS3 库
lib_deps =
    m5stack/M5Unified@^0.2.29
    ; JSON 读写（/data/config/*.json、网页 API）
    bblanchon/ArduinoJson@^7.2.0
    lvgl/lvgl@9.2.2
; USB 改为 USB-OTG(TinyUSB) 模式，才能把 SD 卡作为 U 盘暴露给电脑（lib/mda_sdmsc）
build_unflags =
      -Os
build_flags =
      -O2
      -D LV_CONF_INCLUDE_SIMPLE         ; 让 LVGL 用 include/lv_conf.h
      -D LV_LVGL_H_INCLUDE_SIMPLE       ; 让 src/assets 里的素材 .c 用 #include "lvgl.h"
      '-D LV_CONF_KCONFIG_EXTERNAL_INCLUDE="lv_kconfig_none.h"'   ; 绕过 LVGL 汇编文件找不到 esp_attr.h 的编译错误
      -I include
      -D CORE_DEBUG_LEVEL=3
; 排除仿真独立目录
build_src_filter =
      +<*>
      -<sim/>

; 电脑仿真：用 SDL 开一个 320x240 窗口跑同一套 UI，鼠标当触摸
; 运行：pio run -e sim && .pio/build/sim/program
; 依赖：brew install sdl2
[env:sim]
platform = native
lib_ldf_mode = chain+
; 仿真环境忽略仅适用于硬件平台的库
lib_ignore =
    M5Unified
    bettery
    network
    storage
lib_deps =
    lvgl/lvgl@9.2.2
build_flags =
      -D MDA_SIM                        ; 仿真开关：lv_conf.h 据此打开 SDL
      -D LV_CONF_INCLUDE_SIMPLE
      -D LV_LVGL_H_INCLUDE_SIMPLE
      -I include
      -I src
      -I lib/logger
      -I lib/bettery
      -I lib/network
      -I lib/storage
      !sdl2-config --cflags --libs
      !echo "-I$(sdl2-config --prefix)/include"   ; LVGL 用 <SDL2/SDL.h>，需要 SDL2 的上一级目录
; 只编译不依赖硬件的部分：UI、素材、仿真专用目录（包含所有的仿真Mock和main入口）
build_src_filter =
      +<ui/>
      +<assets/>
      +<sim/>
