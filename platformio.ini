; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; M5Unified 会自动拉取 M5GFX；CoreS3 官方推荐用它，替代旧的 M5CoreS3 库
lib_deps =
    m5stack/M5Unified@^0.2.29
    ; JSON 读写（/data/config/*.json、网页 API）
    bblanchon/ArduinoJson@^7.2.0
    lvgl/lvgl@9.2.2
; USB 改为 USB-OTG(TinyUSB) 模式，才能把 SD 卡作为 U 盘暴露给电脑（lib/mda_sdmsc）
;build_unflags =
;    -DARDUINO_USB_MODE=1
build_flags =
;    -DARDUINO_USB_MODE=0
      -D LV_CONF_INCLUDE_SIMPLE         ; 让 LVGL 用 include/lv_conf.h
      -D LV_LVGL_H_INCLUDE_SIMPLE       ; 让 src/assets 里的素材 .c 用 #include "lvgl.h"
      '-D LV_CONF_KCONFIG_EXTERNAL_INCLUDE="lv_kconfig_none.h"'   ; 绕过 LVGL 汇编文件找不到 esp_attr.h 的编译错误
      -I include
      -D CORE_DEBUG_LEVEL=3


